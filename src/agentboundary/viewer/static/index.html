<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Boundary — audit trace</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #5c6370; --line: #d8dce3;
    --refuse: #a3272b; --refuse-bg: #fcf0f0; --authorise: #1f6b3a; --authorise-bg: #eef7f1;
    --code-bg: #f5f6f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e6e8ec; --muted: #9aa2af; --line: #2c313a;
      --refuse: #ff8b8f; --refuse-bg: #2a1719; --authorise: #7fd6a0; --authorise-bg: #14231a;
      --code-bg: #1c1f25;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.5rem; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .lede { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
  .summary { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 1rem 1.25rem;
             border: 1px solid var(--line); border-radius: 8px; margin-bottom: 1.5rem; }
  .stat b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .8rem; text-transform: uppercase;
               letter-spacing: .05em; }
  .record { border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px;
            padding: .85rem 1rem; margin-bottom: .75rem; }
  .record[data-outcome="refuse"] { border-left-color: var(--refuse); background: var(--refuse-bg); }
  .record[data-outcome="authorise"] { border-left-color: var(--authorise);
                                      background: var(--authorise-bg); }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem; }
  .verdict { font-weight: 700; letter-spacing: .03em; }
  .record[data-outcome="refuse"] .verdict { color: var(--refuse); }
  .record[data-outcome="authorise"] .verdict { color: var(--authorise); }
  .tool { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .reason { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .82rem; padding: .1rem .4rem; border-radius: 4px;
            background: var(--code-bg); }
  .seq { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .82rem; }
  .status { color: var(--muted); font-size: .82rem; margin-left: auto; }
  pre { background: var(--code-bg); padding: .6rem .75rem; border-radius: 5px;
        overflow-x: auto; font-size: .82rem; margin: .6rem 0 0; }
  ol.checks { margin: .6rem 0 0; padding-left: 1.2rem; font-size: .85rem; }
  ol.checks li { margin: .15rem 0; }
  ol.checks .failed { color: var(--refuse); font-weight: 600; }
  .empty { color: var(--muted); padding: 2rem; text-align: center;
           border: 1px dashed var(--line); border-radius: 8px; }
  h2 { font-size: 1.05rem; margin: 2.5rem 0 .25rem; }
  .caveat { color: var(--muted); font-size: .85rem; margin: 0 0 1rem;
            border-left: 3px solid var(--line); padding-left: .75rem; }
  .lease { border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px;
           padding: .85rem 1rem; margin-bottom: .75rem; }
  /* An active lease carries the alarm colour and an expired one does not. The
     boundary is narrower while a lease runs, so "in force" is the state that
     should catch an eye scanning the page, not the reassuring one. */
  .lease[data-state="active"] { border-left-color: var(--refuse); background: var(--refuse-bg); }
  .lease[data-state="expired"] { border-left-color: var(--line); }
  .lease[data-state="pending"] { border-left-color: var(--muted); }
  .lease .state { font-weight: 700; }
  .lease[data-state="active"] .state { color: var(--refuse); }
  .lease .reason { font-family: inherit; background: none; padding: 0;
                   color: var(--muted); font-size: .85rem; }
  .advisory { border: 1px solid var(--refuse); border-radius: 6px; padding: .85rem 1rem;
              margin-bottom: .75rem; background: var(--refuse-bg); font-size: .88rem; }
</style>
</head>
<body>
<main>
  <h1>Audit trace</h1>
  <p class="lede">
    Read-only. This viewer has no write path: every proposed call is shown as the
    broker decided it, refusals included, and every lease is shown as an operator
    granted it out of band.
  </p>

  <section class="summary" id="summary" aria-label="Summary"></section>
  <section id="records" aria-label="Records"></section>

  <h2>Leases in force</h2>
  <p class="caveat" id="lease-notice" data-testid="lease-notice"></p>
  <section class="summary" id="lease-summary" aria-label="Lease summary"></section>
  <section id="leases" aria-label="Leases"></section>

  <h2>Rotation owed</h2>
  <section id="advisories" aria-label="Rotation advisories"></section>
</main>

<script>
"use strict";

// Everything below builds DOM with textContent. No innerHTML anywhere: a trace
// is full of attacker-authored strings, and rendering one as markup would turn
// the viewer into the exfiltration path the broker just refused.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = String(text);
  return node;
}

function stat(value, label) {
  const wrap = el("div", "stat");
  wrap.appendChild(el("b", null, value));
  wrap.appendChild(el("span", null, label));
  return wrap;
}

function renderSummary(summary) {
  const host = document.getElementById("summary");
  host.replaceChildren();
  host.appendChild(stat(summary.total, "calls"));
  host.appendChild(stat(summary.authorised, "authorised"));
  host.appendChild(stat(summary.refused, "refused"));
  for (const [reason, count] of Object.entries(summary.reasons || {})) {
    host.appendChild(stat(count, reason));
  }
}

function renderRecord(record) {
  const refused = record.outcome === "refuse";
  const node = el("article", "record");
  node.dataset.outcome = record.outcome;
  node.dataset.tool = record.tool_name;
  if (record.reason) node.dataset.reason = record.reason;
  node.setAttribute("data-testid", "record");

  const head = el("div", "head");
  head.appendChild(el("span", "seq", "#" + record.sequence));
  const verdict = el("span", "verdict", refused ? "REFUSED" : "AUTHORISED");
  verdict.setAttribute("data-testid", "verdict");
  head.appendChild(verdict);
  head.appendChild(el("span", "tool", record.tool_name));
  if (record.reason) {
    const reason = el("span", "reason", record.reason);
    reason.setAttribute("data-testid", "reason");
    head.appendChild(reason);
  }
  const status = el("span", "status", "task " + record.task_id + " · " + record.result_status);
  status.setAttribute("data-testid", "attribution");
  head.appendChild(status);
  node.appendChild(head);

  const args = el("pre", null, JSON.stringify(record.validated_arguments, null, 2));
  args.setAttribute("data-testid", "arguments");
  node.appendChild(args);

  const checks = el("ol", "checks");
  checks.setAttribute("data-testid", "checks");
  for (const check of record.checks || []) {
    const item = el("li", check.passed ? "passed" : "failed",
      check.name + (check.detail ? " — " + check.detail : ""));
    checks.appendChild(item);
  }
  node.appendChild(checks);
  return node;
}

function renderRecords(records) {
  const host = document.getElementById("records");
  host.replaceChildren();
  if (!records.length) {
    host.appendChild(el("p", "empty", "No calls recorded for this task."));
    return;
  }
  for (const record of records) host.appendChild(renderRecord(record));
}

// Leases. Displayed, never actuated: nothing below creates an element that can
// be submitted, clicked or edited. A viewer that could grant a lease would be a
// second write path into the store, reachable over HTTP, in a process the rest
// of this design keeps read-only.
function renderLease(lease) {
  const node = el("article", "lease");
  node.dataset.state = lease.state;
  node.dataset.kind = lease.kind;
  node.dataset.subject = lease.subject;
  node.setAttribute("data-testid", "lease");

  const head = el("div", "head");
  head.appendChild(el("span", "tool", lease.kind + " " + lease.subject));
  const state = el("span", "state", lease.state_text);
  state.setAttribute("data-testid", "lease-state");
  head.appendChild(state);
  const who = el("span", "status",
    lease.sensitivity + " · by " + lease.granted_by + " · " +
    (lease.task_id === null ? "every task" : "task " + lease.task_id));
  who.setAttribute("data-testid", "lease-attribution");
  head.appendChild(who);
  node.appendChild(head);

  const reason = el("p", "reason", "Reason: " + lease.reason);
  reason.setAttribute("data-testid", "lease-reason");
  node.appendChild(reason);
  return node;
}

function renderLeases(payload) {
  document.getElementById("lease-notice").textContent = payload.notice;

  const summary = document.getElementById("lease-summary");
  summary.replaceChildren();
  summary.appendChild(stat(payload.summary.granted, "leases granted"));
  summary.appendChild(stat(payload.summary.active, "in force now"));
  summary.appendChild(stat(payload.summary.expired, "expired"));
  summary.appendChild(stat(payload.summary.rotation_owed, "rotation owed"));

  const host = document.getElementById("leases");
  host.replaceChildren();
  if (!payload.leases.length) {
    host.appendChild(el("p", "empty", "No lease has been granted."));
  } else {
    for (const lease of payload.leases) host.appendChild(renderLease(lease));
  }

  const advisories = document.getElementById("advisories");
  advisories.replaceChildren();
  if (!payload.advisories.length) {
    advisories.appendChild(
      el("p", "empty", "No credential lease has expired, so no rotation is owed."));
    return;
  }
  for (const advice of payload.advisories) {
    const node = el("article", "advisory", advice.message);
    node.setAttribute("data-testid", "advisory");
    node.dataset.subject = advice.subject;
    advisories.appendChild(node);
  }
}

Promise.all([
  fetch("trace.json").then((response) => response.json()),
  fetch("leases.json").then((response) => response.json()),
])
  .then(([trace, leases]) => {
    renderSummary(trace.summary);
    renderRecords(trace.records);
    renderLeases(leases);
    document.body.dataset.loaded = "true";
  })
  .catch((error) => {
    document.getElementById("records").appendChild(
      el("p", "empty", "Could not load the trace: " + error.message));
    document.body.dataset.loaded = "error";
  });
</script>
</body>
</html>
