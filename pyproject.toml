[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-boundary"
version = "0.4.0"
description = "A deterministic tool-call broker that bounds what an LLM agent can actually do."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Tom Durand-Gasselin" }]
keywords = ["llm", "agent", "security", "prompt-injection", "mcp", "authorization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
agent-boundary = "agentboundary.__main__:main"

[project.urls]
Homepage = "https://github.com/impactRssi/agent-boundary"
Source = "https://github.com/impactRssi/agent-boundary"
"Threat model" = "https://github.com/impactRssi/agent-boundary/blob/main/docs/THREAT_MODEL.md"
"Security policy" = "https://github.com/impactRssi/agent-boundary/blob/main/SECURITY.md"

[project.optional-dependencies]
# >=2.0, not >=1.2. The stdio adapter registers its handlers through the
# constructor (`on_list_tools`/`on_call_tool`); the 1.x decorator form was
# removed in 2.0, so the two are not interchangeable. The old floor claimed a
# compatibility that would have failed on an operator's first call -- which is
# what 0% coverage on the adapter concealed until node N-30.
mcp = [
    "mcp>=2.0",
]

# The broker-only runner (N-50). An agent SDK, never a runtime dependency and
# never on the authorisation path -- ADR-0009 §6 fixes that, and
# tests/unit/test_evidence_is_not_a_benchmark.py enforces it.
#
# Depends on the `mcp` extra rather than restating its floor: the runner spawns
# `python -m agentboundary` from this same installation, so the server half must
# be present, and two copies of a version floor drift.
#
# >=0.2.144 is the version the surface was verified against, not a guess. The
# runner sets `tools=[]` to mean "no built-in tools", which is a distinct option
# from `allowed_tools` and is only load-bearing because the SDK encodes the
# empty list explicitly rather than treating it as unset. An older release that
# lacked the option would leave a session with a full native tool set and no
# error, so the floor is the whole control.
runner = [
    "agent-boundary[mcp]",
    "claude-agent-sdk>=0.2.144",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]
gui = [
    "pytest-playwright>=0.5",
]

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/agentboundary"]
# PEP 561. Without this marker a downstream type checker silently treats the
# whole package as untyped, which for a security library means callers lose the
# guarantees the annotations were written to provide.
artifacts = ["src/agentboundary/py.typed", "src/agentboundary/viewer/static/*"]

# ---------------------------------------------------------------------------
# Tests
#
# The `security` marker selects the adversarial subset. That subset runs as a
# separate, blocking CI step -- see ADR-0006 and .github/workflows/ci.yml.
# `--strict-markers` means a typo in a marker name fails the run instead of
# silently deselecting the test it was meant to select.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "security: adversarial payload asserting the broker refused a call",
  "e2e: exercises the assembled system over a real transport",
  "gui: drives the audit-trace viewer in a real browser",
]

[tool.coverage.run]
source = ["agentboundary"]
branch = true
# The E2E tier runs the broker in a real child process. Parallel mode plus
# coverage.py's COVERAGE_PROCESS_START hook (armed in
# tests/e2e/test_stdio_transport.py) means the child's data file is written
# alongside the parent's and combined into the report, so the transport is
# measured where it actually runs rather than reported as dead code.
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Raised toward 90 as the broker lands. The authorisation path itself is held
# at 100% by the unit tier; this global floor is the weaker, whole-package
# guarantee.
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "B",         # bugbear
  "S",         # flake8-bandit
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # prefer pathlib -- path handling is security-relevant here
  "RUF",       # ruff-specific
  "ANN",       # annotations
  "TID",       # tidy imports
]
ignore = [
  "ANN401",    # explicit Any is sometimes the honest type at a trust boundary
]

[tool.ruff.lint.per-file-ignores]
# Adversarial fixtures contain deliberately hostile strings and hardcoded
# sample paths. Flagging them as findings would train reviewers to ignore the
# scanner, which is worse than the noise.
"tests/**" = ["S101", "S105", "S106", "S108", "ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
# scripts/ is in the type gate too: capture_viewer.py drives the real
# broker and the real viewer, so a break there is a break in the
# evidence the README shows, not merely in a helper.
files = ["src", "tests", "scripts"]
# Each test tier has its own conftest. Without explicit package bases they all
# resolve to the module name "conftest" and mypy refuses to check any of them.
explicit_package_bases = true
namespace_packages = true
mypy_path = "src:."

# Tests are held to the same strictness as the package. A test that is not
# type-checked is a test whose assertions can drift from the interface it
# claims to pin down.

# ---------------------------------------------------------------------------
# SAST
#
# The project's own SAST must return zero high-severity findings against
# itself. Test fixtures are excluded because they are hostile by design.
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]
