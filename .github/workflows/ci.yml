# Every job here is blocking. There is no advisory step and no continue-on-error.
#
# The adversarial suite is a SEPARATE job rather than a stage of `unit`. It has
# to be possible to look at a commit and see whether the attack corpus passed,
# without that answer being averaged into a general test result. See ADR-0006.
#
# Every test tier runs under its own collection guard -- `--adversarial-guard`,
# `--e2e-guard`, `--gui-guard`. A tier that can pass by collecting nothing
# reports the same green tick whether it proved something or nothing, and the
# e2e and gui tiers could do exactly that until node N-31: `make test-e2e`
# reported success with the MCP SDK absent. The `guards-fail-closed` step
# asserts from outside that each guard still fails on an empty tier, because a
# regression in a guard would otherwise suppress its own alarm.
#
# Every `uses:` names a commit SHA, never a tag. A tag is a pointer its owner
# can move, and moving it substitutes code inside a job that holds this
# repository's GITHUB_TOKEN. The trailing comment records which tag the digest
# was resolved from, so a reviewer can check the pin without leaving the diff.
# `scripts/check_action_pins.py` fails this workflow if a tag reappears.
#
# Every job starts with an egress audit and declares its own `permissions:`,
# and every checkout runs with `persist-credentials: false` so the token is not
# written into .git/config where a later third-party step could read it.
# The egress policy is `audit`, not `block`: the legitimate destination set of
# this pipeline has not been measured, and a blocking policy written from
# guesswork fails closed on the wrong thing. Audit produces the evidence a
# blocking policy would need. It is a record, not a control -- do not read a
# clean audit as a bound on what a job can reach.
# `scripts/check_workflow_hardening.py` fails this workflow if any of the three
# is dropped from a job.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a toolchain bump is a reviewed commit, not a silent drift.
  UV_VERSION: "0.9.9"
  PYTHON_VERSION: "3.12"

jobs:
  static:
    name: format, lint, types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # mypy type-checks the MCP adapter and the GUI tier, so both have to be
      # present. `--group dev` alone fails here with six import errors, which is
      # the same failure a contributor hits on a clean clone.
      - run: uv sync --group dev --group gui --extra mcp --frozen
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      # Catches what YAML parsing cannot. GitHub validates workflow expressions
      # server-side, so a bad one is invisible locally: every check here parsed
      # ci.yml as YAML -- which it validly is -- and none parsed the
      # expressions inside it. That is how this file shipped with
      # `join(needs.*.result, " ")`, which GitHub rejects because expressions
      # take only single-quoted strings, and the first real run failed in zero
      # seconds with no jobs at all.
      - name: Validate workflow syntax and expressions
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: Types
        run: uv run mypy

  unit:
    name: unit tests and coverage floor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # The coverage step below runs the whole suite under every tier guard, so
      # every tier's dependencies have to be here. Arming a guard against a tier
      # whose dependencies were never installed would fail the build for the
      # wrong reason.
      - run: uv sync --group dev --group gui --extra mcp --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Unit tier
        run: uv run pytest tests/unit
      # Coverage over the whole suite. The transport and entry point are
      # exercised end to end by design; a unit-only figure would report them
      # as dead code and reward mocking the boundary under test.
      - name: Coverage floor
        run: |
          uv run pytest tests --adversarial-guard --e2e-guard --gui-guard \
            --cov=agentboundary --cov-report=term-missing

  adversarial:
    name: adversarial corpus (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev --frozen

      # --adversarial-guard fails this job if the suite collected zero payloads
      # or skipped one. Without it, a renamed directory or a broken marker
      # produces a green tick having asserted nothing at all.
      - name: Adversarial tier under the zero-collect and no-skip guard
        run: uv run pytest tests/adversarial --adversarial-guard -v

      # The guards live in our own conftest, so a regression that disabled one
      # would also hide itself. This asserts from outside that arming each
      # guard against a tier containing nothing still fails the process.
      #
      # Invoked through the Makefile rather than restated here: this file and
      # `make check` claim to run the same thing, and two copies of a control
      # drift. The target needs no tier dependencies -- it runs the unit tier
      # and asserts the *other* tiers are reported empty.
      - name: Prove every tier guard still fails closed
        run: make guards-fail-closed

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # --extra mcp: the E2E tier drives the assembled system, and the MCP
      # server is how the system is meant to be assembled.
      - run: uv sync --group dev --extra mcp --frozen
      # --e2e-guard: without it this job reports success on a tier whose MCP
      # SDK is absent, which is exactly what it did before node N-31.
      - name: End-to-end tier under the zero-collect and no-skip guard
        run: uv run pytest tests/e2e --e2e-guard -v
      - name: Worked example runs offline
        run: uv run python examples/support_triage.py

  gui:
    name: gui (real browser)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `disable-sudo` is deliberately not set here: this job installs browser
      # system dependencies with apt. Turning it on would fail the job, not
      # harden it.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev --group gui --extra mcp --frozen
      - run: uv run playwright install --with-deps chromium
      # Drives a real browser against a trace produced by the real broker. A
      # GUI test over hand-written JSON would pass even if the broker stopped
      # recording refusals, which is one of the things the viewer exists to show.
      - name: GUI tier under the zero-collect and no-skip guard
        run: uv run pytest tests/gui --gui-guard -v

  security:
    name: sast, dependency audit, secrets, pipeline hardening
    runs-on: ubuntu-latest
    # gitleaks-action can post a pull-request comment when given
    # `pull-requests: write`. It is not given it: the job failing is the signal,
    # and a scanner that can write to the repository is a scanner worth
    # compromising.
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gitleaks needs history in order to scan it.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev --frozen

      # A security project that fails its own SAST is not shippable.
      - name: SAST (bandit)
        run: uv run bandit -c pyproject.toml -r src -ll

      - name: SAST (semgrep)
        run: |
          uv tool install semgrep
          uv tool run semgrep --config=p/python --config=p/security-audit \
            --error --metrics=off src/

      # Audits the hash-pinned lockfile rather than the live environment:
      # --require-hashes means a substituted artifact fails rather than passes.
      - name: Dependency audit
        run: |
          uv export --group dev --format requirements-txt --no-emit-project \
            > .requirements.audit.txt
          uv run pip-audit --strict --require-hashes -r .requirements.audit.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs last and gates the whole workflow through `gate`. Every step above
      # is third-party code fetched by reference; this asserts that none of
      # those references can be repointed by anyone but us. It fails closed on
      # an empty workflow directory -- a pin check that examined nothing is not
      # a pin check.
      - name: Actions are pinned to immutable digests
        run: uv run python scripts/check_action_pins.py

      # Least privilege stated per job, an egress audit opening every job, and
      # no checkout leaving the token behind in .git/config.
      - name: Jobs take no privilege they do not need
        run: uv run python scripts/check_workflow_hardening.py

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [static, unit, adversarial, e2e, gui, security]
    if: always()
    # This job reads no code and calls no API. It needs nothing, so it is given
    # nothing -- an empty map, not an inherited `contents: read`.
    permissions: {}
    steps:
      # harden-runner runs here too, under `permissions: {}`. Its token input
      # defaults to github.token, which has no scopes under an empty map; its
      # own documentation describes the token as rate-limit avoidance only, so
      # this should hold -- but it is unverified until CI has actually run, and
      # it lands on the one job that must stay green. Recorded in the threat
      # model rather than exempted here: an exemption is how a uniform rule
      # stops being uniform.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # A required check that passes when a needed job was skipped or cancelled
      # is a check that does not gate anything.
      - name: Fail unless every upstream job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: ${results}"
          for r in ${results}; do
            if [ "$r" != "success" ]; then
              echo "::error::Gate failed: an upstream job reported '${r}'."
              exit 1
            fi
          done
          echo "All blocking jobs succeeded."
