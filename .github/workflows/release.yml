# Release: build, generate an SBOM, sign keylessly, attach.
#
# Runs on a tag. The gate in ci.yml still has to pass -- this workflow does not
# re-run it and does not replace it; a tag pushed at a red commit produces
# nothing, because the `gate` job is a required check on the branch.
#
# Every `uses:` names a commit SHA with the tag it came from in a trailing
# comment. This workflow holds `contents: write`, `id-token: write` and
# `attestations: write`; an action fetched by a movable tag here could sign
# and publish something nobody wrote. See scripts/check_action_pins.py.
#
# The job starts with an egress audit and checks out with
# `persist-credentials: false`. Audit records destinations; it does not bound
# them. See the header of ci.yml.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.9"
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: build, attest, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: the OIDC token is the identity, so there is no signing
      # key to store, rotate, or leak. A long-lived key in a repository secret
      # is the thing this avoids.
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # This job holds `contents: write`. Leaving that token in
          # .git/config would hand it to every later step, including three
          # third-party actions that have no business writing to the
          # repository. action-gh-release receives it explicitly instead.
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}

      # The gate, again, at the exact commit being released. CI having passed
      # on the branch is not the same statement as the tag being releasable.
      - name: Re-run the blocking gate at this commit
        run: |
          uv sync --group dev --group gui --extra mcp --frozen
          uv run playwright install --with-deps chromium
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest tests --adversarial-guard --cov=agentboundary
          uv run bandit -c pyproject.toml -r src -ll

      - name: Build
        run: uv build

      # The wheel's component list is empty because the core package has zero
      # runtime dependencies. That is the claim, not a broken scan -- the
      # second SBOM covers what an install of the [mcp] extra actually pulls.
      - name: SBOM (wheel)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/agent_boundary-${{ github.ref_name }}-py3-none-any.whl
          format: cyclonedx-json
          output-file: sbom.wheel.cdx.json

      - name: SBOM (resolved environment, including the mcp extra)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .venv
          format: cyclonedx-json
          output-file: sbom.environment.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Passed as an input rather than picked up from .git/config, so the
          # grant is visible at the one step that needs it.
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/*
            sbom.wheel.cdx.json
            sbom.environment.cdx.json
          generate_release_notes: true
